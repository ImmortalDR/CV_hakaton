# Docker service addresses may change after container restarts.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream fsp_api {
  zone fsp_api 64k;
  server api:8000 resolve;
}
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ { proxy_pass http://fsp_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri /index.html; }
}
